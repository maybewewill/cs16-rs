name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: ".exe"
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev cmake libopus-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config opus

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.target }}-

      - name: Build release binaries
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          -p cs-client -p cs-server -p cs-hltv -p cs-master -p cs-probe

      - name: Build showcase .csmod bundles
        run: cargo xtask mod build

      - name: Stage and package archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          NAME="cs16-rs-${TAG}-${PLATFORM}"
          STAGE="release-stage/${NAME}"
          mkdir -p "${STAGE}/mods/community" "${STAGE}/docs" "${STAGE}/configs" "${STAGE}/sdk"

          for bin in cs-client cs-server cs-hltv cs-master cs-probe; do
            cp "target/${TARGET}/release/${bin}${EXT}" "${STAGE}/"
          done

          if ls dist/mods/*.csmod >/dev/null 2>&1; then
            cp dist/mods/*.csmod "${STAGE}/mods/"
          fi
          if ls mods/community/*.py >/dev/null 2>&1; then
            cp mods/community/*.py "${STAGE}/mods/community/"
          fi
          cp -R configs/. "${STAGE}/configs/"
          cp -R sdk/. "${STAGE}/sdk/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "${STAGE}/"
          cp docs/MODDING.md docs/DEPLOYMENT.md "${STAGE}/docs/"

          mkdir -p release-out
          if [ "${ARCHIVE}" = "zip" ]; then
            7z a -tzip "release-out/${NAME}.zip" "./${STAGE}"
          else
            tar -C release-stage -czf "release-out/${NAME}.tar.gz" "${NAME}"
          fi
          ls -lh release-out/

      - name: Upload native release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-out/*

  build-web-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown

      - name: Resolve locked wasm-bindgen version
        shell: bash
        run: |
          WBG_VER=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "WBG_VER=${WBG_VER}" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-web-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-web-

      - name: Cache wasm-bindgen-cli
        id: cache-wbg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WBG_VER }}

      - name: Install matching wasm-bindgen-cli
        if: steps.cache-wbg.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version "${{ env.WBG_VER }}"

      - name: Build and archive Web PWA bundle
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo xtask web-build --release
          touch dist/web/.nojekyll
          mkdir -p release-out
          (cd dist/web && zip -r "../../release-out/cs16-rs-${TAG}-web-pwa.zip" .)
          ls -lh release-out/

      - name: Upload Web PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web-pwa
          path: release-out/*

  publish-release:
    needs: [build-native, build-web-pwa]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum cs16-rs-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase GHCR image name
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Build and push cs-server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
