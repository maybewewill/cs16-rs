name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as rust-toolchain.toml and the declared rust-version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: wasm32 check (library crates)
        run: cargo check --target wasm32-unknown-unknown -p cs-proto48 -p cs-cvar -p cs-assets -p cs-vfs -p cs-pm -p cs-sim -p cs-platform -p cs-transport -p cs-engine -p cs-probe -p cs-clientcore -p cs-game -p cs-local -p cs-mod-api -p cs-mod-host -p cs-mod-sdk

      - name: wasm32 check (cs-relay, cs-client, cs-web)
        run: |
          cargo check --target wasm32-unknown-unknown -p cs-relay --lib
          cargo check --target wasm32-unknown-unknown -p cs-client --lib
          cargo check --target wasm32-unknown-unknown -p cs-web

      - name: Build reference mods
        run: cargo xtask mod-build

      - name: Parity report
        run: cargo xtask parity
