[workspace]
members = [
    "crates/cs-vfs",
    "crates/cs-cvar",
    "crates/cs-assets",
    "crates/cs-proto48",
    "crates/cs-platform",
    "crates/cs-transport",
    "crates/cs-relay",
    "crates/cs-pm",
    "crates/cs-engine",
    "crates/cs-probe",
    "crates/cs-clientcore",
    "crates/cs-local",
    "crates/cs-sim",
    "crates/cs-game",
    "crates/cs-server",
    "crates/cs-client",
    "crates/cs-web",
    "crates/cs-mod-api",
    "crates/cs-mod-host",
    "crates/cs-mod-macros",
    "crates/cs-mod-sdk",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.100"

[workspace.dependencies]
ab_glyph = "0.2"
bytemuck = { version = "1", features = ["derive"] }
bzip2-rs = "0.1.2"
crc32fast = "1"
ctrlc = { version = "3.5.3", features = ["termination"] }
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
flate2 = "1"
glam = { version = "0.34", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["tga", "png", "bmp"] }
pollster = "0.4"
rodio = { version = "0.23", default-features = false, features = ["wav", "mp3", "playback"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmi = { version = "2.0", features = ["deterministic"] }
wgpu = "30"
winit = "0.30"

cs-vfs = { path = "crates/cs-vfs" }
cs-cvar = { path = "crates/cs-cvar" }
cs-assets = { path = "crates/cs-assets" }
cs-proto48 = { path = "crates/cs-proto48" }
cs-platform = { path = "crates/cs-platform" }
cs-transport = { path = "crates/cs-transport" }
cs-relay = { path = "crates/cs-relay" }
cs-pm = { path = "crates/cs-pm" }
cs-engine = { path = "crates/cs-engine" }
cs-probe = { path = "crates/cs-probe" }
cs-clientcore = { path = "crates/cs-clientcore" }
cs-client = { path = "crates/cs-client" }
cs-local = { path = "crates/cs-local" }
cs-sim = { path = "crates/cs-sim" }
cs-game = { path = "crates/cs-game" }
cs-mod-api = { path = "crates/cs-mod-api" }
cs-mod-host = { path = "crates/cs-mod-host" }
cs-mod-macros = { path = "crates/cs-mod-macros" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
