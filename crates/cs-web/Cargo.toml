[package]
name = "cs-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cs-assets = { workspace = true }
cs-client = { workspace = true }
cs-clientcore = { workspace = true }
cs-cvar = { workspace = true }
cs-local = { workspace = true }
cs-platform = { workspace = true }
cs-pm = { workspace = true }
cs-proto48 = { workspace = true }
cs-transport = { workspace = true }
cs-vfs = { workspace = true }
egui = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Performance", "Storage", "console"] }

[dev-dependencies]
cs-engine = { workspace = true }
cs-sim = { workspace = true }
