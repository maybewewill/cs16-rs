[package]
name = "cs-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Test-only accessors (`studio_setups`, `baseline_numbers`). Never enabled in production builds;
# the integration tests enable it through the self dev-dependency below.
test-hooks = []

[dependencies]
cs-assets.workspace = true
cs-cvar.workspace = true
cs-pm.workspace = true
cs-proto48.workspace = true
cs-transport.workspace = true
glam.workspace = true
tracing.workspace = true

[dev-dependencies]
cs-engine = { path = ".", features = ["test-hooks"] }
cs-probe.workspace = true
cs-vfs.workspace = true
