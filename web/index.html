<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>cs16-rs — Counter-Strike 1.6 (Rust Web)</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta property="og:title" content="cs16-rs — Counter-Strike 1.6 in Safe Rust (WebGPU/WASM)">
  <meta property="og:description" content="Play Counter-Strike 1.6 directly in your browser via WebAssembly + WebGPU/WebGL2 with offline ZBots, 1-click WebRTC P2P rooms, and Protocol 48 multiplayer.">
  <meta property="og:image" content="./icons/icon-512.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1d211a; color: #d8ded3; font-family: Tahoma, Verdana, sans-serif; }
    #cs16-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #topbar {
      position: fixed; top: 8px; left: 8px; z-index: 20; display: flex; gap: 6px; align-items: center;
      background: rgba(76, 88, 68, 0.94); border: 1px solid #889180; padding: 4px 8px; font-size: 12px;
    }
    .brand-logo {
      width: 24px; height: 24px; display: block; border: 1px solid #889180; background: #2c3327;
    }
    #control-panel {
      position: fixed; top: 44px; left: 8px; z-index: 20; width: 340px; max-width: calc(100vw - 16px);
      background: rgba(62, 70, 55, 0.96); border: 1px solid #889180; padding: 10px; font-size: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #control-panel.collapsed { display: none; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    button, select, input {
      background: #4c5844; color: #ecefe9; border: 1px solid #889180; padding: 4px 8px; font-size: 12px;
    }
    button:hover { background: #5a6a50; cursor: pointer; }
    input[type="text"], select { flex: 1; background: #2c3327; }
    #status-pill { color: #c4b550; font-weight: bold; }
    #touch-controls {
      position: fixed; bottom: 14px; right: 14px; z-index: 15; display: none; gap: 6px;
    }
    @media (pointer: coarse) { #touch-controls { display: flex; } }
  </style>
</head>
<body>
  <canvas id="cs16-canvas"></canvas>

  <div id="topbar">
    <img class="brand-logo" src="./icons/icon-192.png" alt="cs16-rs" width="24" height="24">
    <button id="btn-toggle-panel">Menu</button>
    <button id="btn-fullscreen">Fullscreen</button>
    <span id="status-pill">Initializing...</span>
  </div>

  <div id="control-panel">
    <div id="asset-status">Drop your Half-Life folder here or mount it below.</div>
    <div class="row">
      <button id="btn-pick-dir">Mount Half-Life Folder</button>
      <button id="btn-pick-fallback">Folder Fallback</button>
      <button id="btn-clear-cache">Clear Cache</button>
      <input id="webkit-dir-input" type="file" webkitdirectory multiple hidden>
    </div>
    <div class="row">
      <label for="map-select">Map</label>
      <select id="map-select"><option value="de_dust2">de_dust2</option></select>
      <label for="bots-count">Bots</label>
      <input id="bots-count" type="number" min="0" max="15" value="4" style="width:52px">
      <button id="btn-start-local">Offline</button>
    </div>
    <div class="row">
      <select id="p2p-max-players" style="flex:0 0 88px">
        <option value="2">1v1 (2p)</option>
        <option value="10" selected>5v5 (10p)</option>
        <option value="16">16p</option>
      </select>
      <button id="btn-host-p2p" style="flex:1">Host P2P Room (1v1 / 5v5 in Browser)</button>
    </div>
    <div class="row">
      <input id="ws-url" type="text" value="ws://127.0.0.1:27016/ws" placeholder="ws://host:27016/ws or /relay?target=...">
      <button id="btn-connect">Connect</button>
      <button id="btn-disconnect">Stop</button>
    </div>
    <div class="row">
      <input id="master-url" type="text" value="http://127.0.0.1:27080/servers" placeholder="http://master:port/servers">
      <button id="btn-refresh-servers">Servers</button>
    </div>
    <div class="row">
      <select id="server-list"><option value="">-- Click Servers to query master --</option></select>
    </div>
  </div>

  <div id="touch-controls">
    <button data-touch-bit="1">Fire</button>
    <button data-touch-bit="32">Jump</button>
    <button data-touch-bit="8">Reload</button>
    <button data-touch-bit="16">Use</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
