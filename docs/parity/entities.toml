# Game logic of cs-game (the mp.dll counterpart, ported from ReGameDLL_CS), Phases 2C-2E.
# Registered in the existing weighted category `entities` ("map and game entity classes") because
# a new category needs a new key in weights.toml and the owner's weights sum to 100.
# Items marked `verified` were compared with the original client and/or the original HLDS build 10210
# on 2026-11-22 and 2026-11-23, see docs/parity/checklists/phase2d-weapons.md and
# docs/parity/checklists/phase2e-objectives.md (Part A); all other items remain unverified on the live
# game. An item is `tested` when a cited test asserts it (docs/parity/README.md) and `implemented` when
# the code exists and no cited test would fail if it broke. The tests compare with ReGameDLL_CS / ReHLDS
# sources, not with the original game.

[[item]]
id = "game_team_menu"
status = "verified"
evidence = "crates/cs-game/tests/teams.rs::new_player_sees_the_team_menu, text_menus_for_clients_that_want_them, chooseteam_shows_the_in_game_menu, team_limits_refuse_as_regamedll, auto_assign_balances, spectators, humans_join_team_sends_players_to_that_team, hostile_team_commands_are_ignored, commands_before_the_player_is_in_the_game_are_harmless; crates/cs-game/tests/rounds.rs::auto_team_balance_moves_the_last_to_join; crates/cs-game/tests/vip_escape.rs::a_vip_is_picked_and_equipped (jointeam 3 queues CT for VIP, living VIP cannot switch teams). Deviations: jointeam 5 with both teams full is refused (REGAMEDLL_FIXES behaviour; vanilla leaves a teamless player); the items a player drops on a team change and the career mode are not ported; team counts are taken from the players when asked, not from the CheckWinConditions cache. Menus are sent from the player's usercmds as vanilla does (JoiningThink from PlayerPreThink). The default team of an Auto-Select join (SelectDefaultTeam with the round-win tie-break): crates/cs-game/tests/teams.rs::the_default_team_is_the_one_with_fewer_round_wins.; VERIFIED 2026-11-22, method 1 (the original Steam CS 1.6 client build 10210 on our server, de_dust2; the team menu (VGUI) opens on the original client and the choice spawns the player; docs/parity/checklists/phase2d-weapons.md V4)"

[[item]]
id = "game_class_menu"
