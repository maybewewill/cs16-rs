evidence = "crates/cs-game/tests/teams.rs::jointeam_then_joinclass_spawns_on_the_team, a_random_appearance_is_one_of_the_teams, the_connect_userinfo_chooses_the_menu_kind, every_team_is_told_to_the_joiner, menus_only_reach_a_client_that_is_in_game; VGUI menus and, for a client with _vgui_menus 0, text menus (ShowMenu). Deviation: the VIP appearance is not offered.; VERIFIED 2026-11-22, method 1 (the original Steam CS 1.6 client build 10210 on our server, de_dust2; the class menu (VGUI) opens on the original client and the choice spawns the player; only the CT choice was tried; docs/parity/checklists/phase2d-weapons.md V4)"

[[item]]
id = "game_player_spawn"
status = "verified"
evidence = "crates/cs-game/tests/player.rs::connected_player_waits_unassigned, spawned_player_has_regamedll_defaults, a_full_spawn_kills_its_occupants, a_spawner_does_not_telefrag_itself_or_the_dead, a_disconnected_player_leaves_the_game, client_data_reflects_the_player; crates/cs-game/tests/game_entities.rs::spawn_points_come_from_the_lump_by_team, spawn_points_of_de_dust2_are_the_lumps_by_team, with_every_point_taken_the_pick_is_the_first_of_the_search, the_fallback_spawn_becomes_the_teams_last_one. The disconnect order (ScoreAttrib, ScoreInfo and TeamInfo before CheckWinConditions, the leaver not counted): crates/cs-game/tests/rounds.rs::the_last_ct_leaving_a_one_on_one_wins_nothing, leaving_players_end_the_round_as_regamedll, nothing_is_announced_when_a_player_leaves_during_the_intermission. The #Game_connected and #Game_disconnected notices: crates/cs-game/tests/player.rs::connecting_and_leaving_are_announced_to_everyone. A userinfo change puts the team model back (ClientUserInfoChanged): crates/cs-game/tests/player.rs::a_userinfo_change_puts_the_team_model_back. Killed sends its messages in the source's order: crates/cs-game/tests/player.rs::a_death_sends_its_messages_in_the_order_of_killed. Deviations: vanilla mp.dll spawn rules (dead players block a spot, telefrag when all are taken), not REGAMEDLL_FIXES; movement is the original pm_shared port cs_sim::pm (the items of docs/parity/movement.toml, among them the client data fields: crates/cs-game/tests/movement.rs::client_data_carries_duck_step_swim_fields; the water, the landing punch and the footsteps: crates/cs-game/tests/movement_world.rs::drowning_as_regamedll, footsteps_reach_others_not_self); the target of a spawn point is not fired (no trigger entities); the VIP spawn is not ported; the trigger_camera intro is ported (crates/cs-game/tests/join_screen.rs::intro_camera_at_join, camera_without_a_target_gives_no_view, no_camera_join_path_unchanged, dust2_joiner_looks_through_the_first_camera; the join runs the Spawn() of ClientPutInServer for a just-connected player: crates/cs-game/tests/hud.rs::join_hud_messages_as_regamedll, init_hud_sequence_as_regamedll); not ported of CTriggerCamera: Use, FollowTarget, Move and its think (the camera taking a player over), CSGameRules m_bMapHasCameras (vanilla never reads it), target entities of any class but info_target (our map loader drops other unknown classes), the no-camera path's pev->angles = gpGlobals->v_forward (a stale global; the spot's angles stand), the NOCLIP and models/player.mdl of the joiner (it stays MOVETYPE_NONE with no model); spawn keeps the spot's angles where vanilla uses gpGlobals v_forward.; VERIFIED 2026-11-22, method 1 (the original Steam CS 1.6 client build 10210 on our server, de_dust2; the intro camera behind the MOTD and the team menu; the spawn as a CT with the knife and the USP 12/24, the crosshair and the weapon-selection HUD; docs/parity/checklists/phase2d-weapons.md V3, V5) and VERIFIED 2026-11-22, method 2 (golden capture diff: cs-probe --diff of the original HLDS build 10210 against our server, a probe running jointeam 2 and joinclass 5; the join, jointeam and joinclass sequences and the weapon client data match; docs/parity/checklists/phase2d-weapons.md V8, V9); the Terrorist spawn and the spawn rules under load were not checked on the original"

