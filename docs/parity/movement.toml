evidence = "crates/cs-sim/tests/pm_walk.rs::player_move_runs_in_source_order, move_tail_mirrors_ground_flag_and_single_player_friction, texture_lookup_defaults_to_concrete; PM_PlayerMove calls its parts in the source's order, PM_Move mirrors FL_ONGROUND and uses the single-player friction 1. Deviation: the stuck tables are indexed by the player slot modulo 32 (the C code would index out of bounds on a bogus slot)."

