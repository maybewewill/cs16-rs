evidence = "crates/cs-game/tests/movement_world.rs::movement_cvars_are_hard_locked; RestartRound sets sv_accelerate 5, sv_friction 4 and sv_stopspeed 75, and Think's once-a-second block resets them when they differ (multiplay_gamerules.cpp 1697-1700 and 2567-2580, read 2026-11-22). ACCEPTED DEVIATION: the registry defaults stay sv_accelerate 5 and sv_stopspeed 100 (ReHLDS: 10 and 100), see docs/parity/cvars.toml."

[[item]]
id = "movement_drowning"
status = "tested"
evidence = "crates/cs-game/tests/movement_world.rs::drowning_as_regamedll; CBasePlayer::WaterMove (air_finished = time + 12, pain every second after it with damage 2 growing to 5, m_idrowndmg, the recovery through CheckTimeBasedDamage and DMG_DROWNRECOVER, lava and slime damage, the swim sounds). Quirks kept: no FL_INWATER test on the gasp sound; the time-based damage compares whole seconds. Accepted deviations: the test sets the edict's waterlevel by hand on a stub map, so the link from PM_CheckWater to drowning is covered only through waterlevel in the real-map water test; max_health is assumed 100; poison and antidote only run their counters."

[[item]]
id = "movement_func_water"
status = "tested"
evidence = "crates/cs-game/tests/movement_world.rs::func_water_spawns_as_a_non_solid_special_contents_door, func_water_gives_the_player_water_on_a_stock_map; func_water is registered with func_door (CBaseDoor::Spawn spawn part, doors.cpp 192-215, read 2026-11-22): a *N model, SOLID_NOT when the skin is non-zero or the door is passable, MOVETYPE_PUSH. SetMovedir runs for func_door and func_water (movedir from the angles, angles zeroed) and SF_DOOR_ACTUALLY_WATER is set for a non-zero skin; the stock-map test skips pools whose world contents are already water, so the entity supplies the contents; crates/cs-game/tests/movement_world.rs::a_door_spawns_with_movedir_from_its_angles_and_none_left"

[[item]]
id = "movement_game_observer_visibility"
status = "tested"
evidence = "crates/cs-game/tests/movement_world.rs::observer_roams_and_chases_through_pm; crates/cs-game/tests/observer.rs::dead_player_becomes_an_observer_after_the_death_cam, spectator_team_roams; the observer moves through PM_SpectatorMove and the roaming cap is the sv_spectatormaxspeed movevar; SetupVisibility moves a chasing observer's origin to its target, as the source does."

[[item]]
id = "movement_footsteps_others"
status = "tested"
evidence = "crates/cs-game/tests/movement_world.rs::footsteps_reach_others_not_self; a step sound is sent to the other players and not to the mover (PM_PlaySound through PM_SV_PlaySound, the mover's own client plays it from prediction); two probes on de_dust2."

[[item]]
id = "movement_client_prediction"
status = "verified"
evidence = "cs_sim::pm is engine-neutral so the client can predict with it, but cs-client and cs-net still use the legacy cs_sim::pmove; the original client predicts with its own pm_shared.; VERIFIED 2026-11-22, method 1 (the original Steam CS 1.6 client build 10210 on our server, de_dust2; walking on the original client with its own prediction against our server; docs/parity/checklists/phase2d-weapons.md V6)"

