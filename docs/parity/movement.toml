# Player movement: pm_shared (cs_sim::pm, ported from ReGameDLL_CS pm_shared, vanilla branch, read
# 2026-11-22), the engine's pmove services (cs-engine pm and texture modules, ported from ReHLDS
# pmove.cpp, pmovetst.cpp, sv_user.cpp, sv_pmove.cpp, pr_cmds.cpp and model.cpp, read 2026-11-22)
# and the game side of SV_RunCmd (cs-game pmove.rs and player.rs).
# Only movement_client_prediction is `verified` (2026-11-22, docs/parity/checklists/phase2d-weapons.md V6);
# no other item has a dated check with the original client yet, see
# docs/parity/checklists/pm-movement.md. An item is `tested` when a cited test asserts it (the
# definition in docs/parity/README.md) and `implemented` when the code exists and no cited test
# would fail if it broke. The tests compare with the sources, not with the original game; the
# BoxWorld of cs-sim's tests is a box-sweep test world, not bit-exact to PM_RecursiveHullCheck,
# and the engine's own traces are compared with the legacy hull trace on de_dust2.
# Accepted deviations that touch every item: float expressions that mix float and double are
# computed in f64 where C does (named where it matters); sin and cos are Rust's, which may differ
# from the C runtime by one ulp (assumption); the console messages of the source are not printed;
# a NaN or infinite value in a command is made finite or reset as PM_CheckVelocity does.

