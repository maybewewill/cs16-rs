# GoldSrc rendering parity (cs-assets parsers + cs-client wgpu renderer, weight 10).
# Phase 8 implemented the renderer features below (BSP, MDL, SPR, decals, particles, beams,
# dynamic lights, fog, view effects, MSAA/anisotropy, software mode). `tested` means our own tests
# assert the behaviour; nothing here has been compared with the original client yet. The phase-8
# exit check (reference screenshots from fixed cameras within tolerance) has not been done, so no
# item is `verified`. Tests that need the game files or a GPU adapter return early without them.

