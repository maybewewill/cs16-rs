# Temporary entities (`svc_temp_entity`, the `TE_*` of `const.h`), weight 4: one item per type of the list,
# TE_BEAMPOINTS (0) to TE_USERTRACER (127); 16 and 26 are unused numbers. Phase 2D added the builders
# (crates/cs-proto48/src/tempent.rs) and `Server::send_temp_entity`. `tested` = a test builds the message
# and checks its bytes against the layout of `const.h` (read 2026-11-22; the layouts of the builders are
# the const.h comments, NOT compared with the original engine or client: no TE is `verified`);
# `implemented` = the stream parser (crates/cs-proto48/src/messages.rs `skip_temp_entity`) takes the
# payload with a fixed length, there is no builder and cs-game does not send it. Parser lengths of the
# types without a builder are from memory of const.h and the engine - confirm; two look wrong and are
# carried to the client phase (TE_BEAMSPRITE 18 and TE_EXPLODEMODEL 107).

[[item]]
id = "TE_BEAMPOINTS"
status = "implemented"
evidence = "wire length in cs_proto48::messages::skip_temp_entity; no builder, cs-game does not send it; the length is from memory - confirm"

