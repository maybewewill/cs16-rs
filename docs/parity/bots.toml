# Bot AI, navigation mesh (.nav), and CZ/ZBot behavior parity (weight 4).
# Phase 2E connected minimal NavGraph bots to cs-engine fake clients (crates/cs-game/src/bots.rs)
# for basic combat and objective play (plant, defuse, hostage rescue); full ZBot / .nav parity is Phase 12.

[[item]]
id = "bot_legacy_sim_brain"
status = "tested"
evidence = "crates/cs-sim/src/bots.rs (directed NavGraph with ceiling-safe stair climb and think_bot_with AI used by MatchWorld and cs-game engine bots); tested in crates/cs-game/tests/bots.rs::bots_move_and_shoot_an_enemy, a_round_with_bots_ends and crates/cs-game/tests/full_round.rs::*"

[[item]]
id = "bot_engine_fake_client_bridge"
status = "tested"
evidence = "crates/cs-game/tests/bots.rs::bot_add_joins_a_team_and_spawns, bots_move_and_shoot_an_enemy, bots_buy_at_round_start, bot_kick_frees_the_slot, a_round_with_bots_ends (cs-game bot driver using EngineApi::create_fake_client and run_player_move, 30 Hz command/10 Hz think pacing); crates/cs-game/tests/bots.rs::a_map_without_bots_builds_no_nav, a_full_team_costs_no_fake_client (a server without bots pays nothing; AddBot settles the team before it creates the client). The IsBot branches of the rules (bots skip the MOTD and menus) are not separately tested"

[[item]]
id = "bot_add_kick_commands"
status = "tested"
evidence = "crates/cs-game/tests/bots.rs::bot_add_joins_a_team_and_spawns, bot_kick_frees_the_slot, a_full_team_costs_no_fake_client (bot_add, bot_add_t, bot_add_ct, bot_kick); bot_quota_match and ZBot subcommands remain Phase 12"

[[item]]
id = "bot_quota_maintenance"
status = "implemented"
evidence = "crates/cs-game/src/bots.rs::maintain_quota (every 0.5 s adds a bot below bot_quota, kicks one above it), wired in cs-server --proto48 --bots (crates/cs-server/src/proto48.rs::tests::vanilla_round_time only starts the server with it); no test drives maintain_quota itself"

