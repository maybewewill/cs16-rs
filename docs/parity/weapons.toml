# Weapons, items and economy of cs-game, phases 2D-2E (ReGameDLL_CS vanilla `mp.dll` behaviour), weight 10.
# `tested` = a named test asserts the item against the ReGameDLL_CS / ReHLDS source (master, read
# 2026-11-22 / 2026-11-23); `implemented` = the code is there and no cited test would fail if it broke;
# `verified` = compared with the original game (Steam CS 1.6 build 10210) on 2026-11-22 / 2026-11-23,
# naming the method and checklist row (`docs/parity/checklists/phase2d-weapons.md` or
# `phase2e-objectives.md`). Live weapon firing is still unchecked on the original client (rows 1 to 20
# of phase2d-weapons.md). Shield, autobuy/rebuy and game_player_equip are not ported (`missing`);
# C4/bomb, defuser, VIP and minimal engine bots landed in phase 2E (`tested`, with partial HLDS diffs).

[[item]]
id = "weapon_tables"
status = "tested"
evidence = "crates/cs-game/tests/weapon_tables.rs::prices_clips_and_ammo_match_weapontype_cpp, item_info_matches_get_item_info, ammo_indices_follow_precache_order, aliases_round_trip, weapon_struct_matches_weapontype_cpp, default_give_matches_clip_give_default; crates/cs-game/tests/weapon_core.rs::the_registry_has_every_weapon. The tables are ported row by row from weapontype.cpp, weapons.cpp and each wpn_*.cpp GetItemInfo (read 2026-11-22)."

[[item]]
id = "weapon_shared_random"
status = "tested"
evidence = "crates/cs-game/tests/weapon_tables.rs::shared_random_matches_util_cpp (util.cpp UTIL_SharedRandomLong/Float, checked against a second implementation); crates/cs-game/tests/bullets.rs::spread_uses_the_shared_seed; crates/cs-engine/tests/weapon_data.rs::random_seed_follows_rehlds_and_halves_share_it, split_commands_run_both_halves_with_the_same_seed, seeds_through_a_lossy_move_follow_rehlds (the per-command seed of sv_user.cpp). Assumptions: the float generator assumes f32 SSE arithmetic as the original binary; shared_random_long returns the low bound where C divides by zero. Not checked against the original client's own generator (the client prediction of cl_lw 1 is the owner's checklist row 3)."

