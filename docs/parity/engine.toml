_BASELINE_RESERVE (see the item signon_budget), a light style keeps at most 63 bytes (pr_cmds.cpp PF_lightstyle_I with Q_strlcpy into MAX_LIGHTSTYLE_SIZE 64, qlimits.h; longer patterns are cut, not refused), a sound comes from origin + (mins + maxs) / 2 (sv_main.cpp SV_StartSound_internal), MAX_MSGLEN is 3990; a sound is multicast to the PAS as MSG_FL_PAS in SV_StartSound_internal (PAS built as CM_CalcPAS in cmodel.cpp, read 2026-11-21; tests: crates/cs-engine/tests/messages.rs::sound_reaches_a_listener_behind_a_wall, crates/cs-engine/src/map.rs::tests::pas_is_a_superset_of_pvs, pas_memory_is_bounded); the audience follows SV_Multicast/SV_ValidClientMulticast (sound leaf PAS row, client origin leaf; a sound in solid reaches everyone; no PAS with one client, without visibility data or past the caps of 4096 leafs and 128 MiB of byte ORs), the PAS is built at map activation as SV_SpawnServer does (tests: crates/cs-engine/src/map.rs::tests::pas_is_the_or_of_the_pvs_of_the_visible_leaves, no_pas_means_everyone_hears, pas_build_is_capped_in_leafs_and_in_work, pas_excludes_the_far_spawn_and_a_solid_point_is_heard_everywhere; crates/cs-engine/tests/messages.rs::sound_outside_the_pas_is_not_sent, a_sound_in_solid_is_heard_by_everyone, static_channel_and_stop_sounds_are_broadcast); CHAN_STATIC and SND_STOP sounds are broadcast reliably to the active clients in multiplayer as SV_StartSound_internal does (client->active is set in SV_Spawn_f); MsgDest::Pvs uses the same SV_Multicast rule as Pas (sound leaf PVS, client origin leaf); a non-finite point reaches no one (our rule); a send is dropped (counted in NetStats::outbox_dropped) when the target buffer of the call already holds more than MAX_RELIABLE_BACKLOG bytes; the worst-case spawn stage (init buffer at its budget, 64 styles of 63 bytes, 32 userinfos of 256 bytes) is bounded by SPAWN_TAIL_MAX and fits NET_MAX_PAYLOAD (crates/cs-engine/src/server.rs::tests::worst_case_spawn_stage_fits_the_reliable_payload, spawn_tail_max_is_the_worst_case_of_the_tail), see signon_budget for what happens to baselines that do not fit; the other limits (1024 bytes of text, 3990 bytes per send, volume 0..1, attenuation 0..3.98) are working assumptions"

