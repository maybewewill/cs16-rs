[[item]]
id = "game_messages"
status = "tested"
evidence = "crates/cs-engine/tests/messages.rs::each_destination_reaches_exactly_its_audience, pvs_message_respects_visibility (de_dust2 half runs only with the installed game), usermsg_roundtrips_to_the_probe, prints_and_stufftext_arrive, sound_requires_precache_and_reaches_listeners, init_messages_are_replayed_to_late_joiners, init_messages_come_from_spawn_entity_too_and_only_during_activation, a_full_init_buffer_still_reaches_a_late_joiner, light_styles_are_stored_and_updated, temp_entities_and_raw_sends_follow_the_limits, out_of_range_slots_and_stale_entities_are_ignored, per_frame_message_flood_respects_client_limits, sound_comes_from_the_centre_of_the_bounds, sound_refuses_an_entity_index_the_wire_cannot_carry, sends_within_one_call_stop_at_the_backlog_cap; crates/cs-engine/src/server.rs::tests::worst_case_spawn_stage_fits_the_reliable_payload; crates/cs-engine/src/api_entities.rs::tests::create_entity_refuses_a_bad_classname_without_allocating; crates/cs-proto48/src/messages.rs::tests::centerprint_and_temp_entity_roundtrip; crates/cs-probe/src/lib.rs::tests::message_log_skips_per_update_messages, message_log_keeps_the_last_1024; destinations (One, OneUnreliable, All, Broadcast, Pvs, Init), the init buffer replayed in the spawn stage after the light styles, the 64 stored light styles and the sound/print/stufftext/centerprint encodings follow the brief and recalled HLDS behaviour (SV_StartSound, SV_ClientPrintf, the light style table), not compared with the original server; assumption: the original client accepts reliable game messages (Init, One) sent to a slot that has not yet sent new, as client_connect writes to such slots, unverified against a real client; checked against the ReHLDS source, read 2026-11-21: the init buffer is 32 KiB (server.h signon_data[32768]), a light style keeps at most 63 bytes (pr_cmds.cpp PF_lightstyle_I with Q_strlcpy into MAX_LIGHTSTYLE_SIZE 64, qlimits.h; longer patterns are cut, not refused), a sound comes from origin + (mins + maxs) / 2 (sv_main.cpp SV_StartSound_internal), NET_MAX_PAYLOAD is 65536 (net.h) and MAX_MSGLEN 3990; deviation: HLDS multicasts a sound with MSG_FL_PAS (potentially audible set), we have no PAS and use the PVS test, so the audience of a sound is narrower than HLDS where the PAS reaches beyond the PVS (assumption: PAS contains PVS); a send is dropped (counted in NetStats::outbox_dropped) when the target buffer of the call already holds more than MAX_RELIABLE_BACKLOG bytes; concern: the worst-case spawn stage (full 32 KiB init buffer, 64 styles of 63 bytes, 32 userinfos of 256 bytes) is 45934 bytes before any baseline, so 867 model entities with origin and angles fit NET_MAX_PAYLOAD (62620 bytes) but 867 entities with every baseline field set (90583) and 2014 model entities (84694) do not; our netchan queue has no 64 KiB cap (the backlog cap is 256 KiB), so nothing breaks, but a real client or HLDS limit at 65536 would; the other limits (1024 bytes of text, 3990 bytes per send, volume 0..1, attenuation 0..3.98) are working assumptions"

