evidence = "crates/cs-engine/tests/unlag.rs::shooter_sees_target_where_its_client_saw_it (100 ms ping and 50 ms interpolation, seen position within 0.5 units of the exact interpolation), unlag_off_traces_current_positions (sv_unlag 0, cl_lc 0 and cl_lw 0), unlag_bounds_and_restores_exactly, rewind_stops_at_the_history, teleported_or_dead_targets_are_not_interpolated, the_rewind_does_not_reach_packets_or_other_commands, a_player_the_game_moved_during_the_command_is_not_put_back, rewinding_and_restoring_touch_no_triggers, links_and_leaves_are_the_same_after_the_restore, a_ping_beyond_the_frames_kept_keeps_the_last_latency; crates/cs-engine/src/unlag.rs::tests::teleport_is_more_than_128_on_any_axis, fraction_is_clamped_and_zero_for_one_instant, userinfo_numbers_read_like_atoi; ported from ReHLDS sv_user.cpp SV_IsLagCompensationActive, SV_GetUnlagTargetTime, SV_FindUnlagFrames, SV_FlagNonInterpolatedPlayers, SV_CalcUnlagFraction, SV_UnlagCheckTeleport, SV_SaveTruePositions, SV_ApplyAdjustedPositions, SV_SetupMove, SV_RestoreMove, SV_GetTrueOrigin and SV_GetTrueMinMax, the ping bookkeeping of SV_ExecuteClientMessage, SV_CalcClientTime and SV_ParseMove, and sv_main.cpp for the cl_lw and cl_lc userinfo (read 2026-11-21): before each 50 ms step of a client's commands the other clients are rewound to where that client saw them (the client's own sent frames, 64 kept, interpolated with cl_interp, capped by sv_maxunlag), relinked without trigger touches, and put back after the step unless the game moved them meanwhile; trace_player_move meets a rewound player at its true origin as the pmove physents do; cvars sv_unlag 1, sv_maxunlag 0.5, sv_unlagpush 0, sv_unlagsamples 1; accepted deviations: when the acknowledged frame is no longer among the 64 kept, the engine keeps the last measured latency (HLDS computes a wrong small value), so a very-high-ping player is compensated where HLDS would not; a frame is stored only when its entity block was sent, so a latency stays 0 when the acked update overflowed; pfnAllowLagCompensation has no counterpart (the game always allows it) and fake clients are not skipped because there are no bots yet; next_messageinterval defaults to 0.05 s instead of the source's 5.0 before cl_updaterate is seen; the health of a frame comes from the edict when the update was built; the PVS and PAS decisions inside the shooter's command use the rewound origins (as HLDS); lerp_msec is a 9-bit field on the wire, so its negative and 32767 cases are reachable only by a direct call; there are no weapons yet, so nothing in the game uses the rewound traces; not compared with the original server"

