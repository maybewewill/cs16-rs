id = "fake_clients"
status = "tested"
evidence = "crates/cs-engine/tests/fake_clients.rs::a_fake_client_takes_a_slot_without_a_peer, run_player_move_moves_the_player, fake_clients_are_never_sent_or_timed_out, fake_clients_skip_unlag_and_events, level_change_drops_fake_clients_as_rehlds, real_clients_unchanged; ported from ReHLDS pr_cmds.cpp (CreateFakeClient_internal, PF_RunPlayerMove_I, PF_MessageEnd_I and EV_Playback fakeclient skips), sv_user.cpp (SV_RunCmd without SV_SetupMove, SV_RestoreMove and the movevars message for a fake client, SV_PreRunCmd empty) and sv_main.cpp (SV_InactivateClients, SV_CheckTimeouts, SV_SendClientMessages, SV_UpdateToReliableMessages, SV_GetFakeClientCount) (read 2026-11-23): EngineApi::create_fake_client takes the first free slot with no address and no netchan, FL_FAKECLIENT | FL_CLIENT on the edict, userinfo name, model gordon, topcolor 1, bottomcolor 1 and *bot 1, ClientConnect is not called (the game puts the bot in the server itself); EngineApi::run_player_move builds a usercmd (random seed 0, msec split in halves above 50) and runs the same path as a client command with svtimebase = host_frametime + sv.time - msec / 1000; the engine never sends or builds anything for a bot, never times it out or kicks it for a reliable backlog, drops what the game writes to it, skips it for events and lag compensation, counts it in the bots of the server info, shows BOT in status, and drops every bot on a level change; accepted deviations: run_player_move queues the command and runs it after the game call that made it returns (the engine never calls the game from inside a game call), so a bot moves at the end of the call, not at the call site; the move is refused for a slot that is not a fake client (the source runs any client); create_fake_client does not call ClientUserInfoChanged (SV_ExtractFromUserinfo does in the source) and makes the name unique and sanitised as for a connecting client; *bot is set at creation (ReGameDLL sets it right after); impulse 204 and clbasevelocity are not ported (as for real clients); status prints the bot with 0ms and BOT in the address column (Host_Status_f puts BOT where the unique id is and prints the ping; our status layout is our own); A2S_PLAYER lists bots as SVC_PlayerInfo does (every active client); the level-change order is that of Host_Changelevel_f (SV_InactivateClients, then SV_ServerShutdown = ServerDeactivate; Host_Map, the console map command, shuts the server down first, which the engine does not distinguish); refused and over-budget bot moves are counted in NetStats::fake_moves_dropped; not compared with the original server"

